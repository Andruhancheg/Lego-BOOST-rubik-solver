<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGO Boost Rubik's Solver</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title-group h1 {
      margin: 0;
      font-size: 1.2rem;
    }
    .version-badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .controls-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .status-pill.connected {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.4);
    }
    button {
      border: 1px solid var(--border);
      background: #273549;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }
    button:hover:not(:disabled) { background: #334661; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: #0284c7; border-color: #38bdf8; }
    button.primary:hover:not(:disabled) { background: #0369a1; }
    button.stop { background: #dc2626; border-color: #f87171; }
    button.stop:hover:not(:disabled) { background: #b91c1c; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .camera-box {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      background: var(--card-2);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .grid-3x3 {
      position: absolute;
      inset: 12%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border: 2px solid rgba(255, 255, 255, 0.85);
      pointer-events: none;
    }
    .cell-mark {
      border: 1px solid rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #0f172a;
      background: rgba(255, 255, 255, 0.75);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .faces-strip {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .face-chip {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      background: var(--card-2);
      border: 1px solid var(--border);
    }
    .face-chip.done {
      border-color: var(--ok);
      color: #86efac;
    }
    .cube-net {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .face-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: #020617;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .sq {
      aspect-ratio: 1 / 1;
      border-radius: 2px;
      background: #334155;
    }
    .log {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      max-height: 120px;
      overflow-y: auto;
      color: #cbd5e1;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title-group">
        <h1>LEGO Boost Rubik's Solver</h1>
        <span class="version-badge" id="appVersion">Версия приложения: v1.1.0-claw-cal</span>
      </div>
      <div class="controls-top">
        <span class="status-pill" id="btStatus">BT: Отключено</span>
        <button class="primary" id="btnConnect">Подключить BT</button>
        <button class="stop" id="btnStop">СТОП</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <strong>Калибровка клешни по сопротивлению мотора</strong>
        <span class="muted" id="clawCalStatus">Ожидание подключения</span>
      </div>
      <div class="muted" id="clawBounds">
        Закрыто (упор): — | Открыто (упор): — | Порт мотора клешни: B
      </div>
      <div class="row">
        <button id="btnRecalibrateClaw" disabled>Повторить автокалибровку клешни</button>
        <button id="btnTestClose" disabled>Закрыть до упора</button>
        <button id="btnTestOpen" disabled>Открыть до упора</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <strong>Камера и сканирование граней</strong>
        <span class="muted" id="scanStepText">Грань 1 из 6 (U)</span>
      </div>
      <div class="camera-box">
        <video id="video" playsinline autoplay muted></video>
        <div class="grid-3x3" id="gridOverlay"></div>
      </div>
      <canvas id="canvas" width="320" height="320" style="display:none;"></canvas>
      <div class="row">
        <button id="btnStartCamera">Включить камеру</button>
        <button class="primary" id="btnScanFace">Сканировать грань</button>
        <button id="btnResetCube">Сбросить развертку</button>
      </div>
      <div class="faces-strip" id="facesStrip"></div>
      <div class="cube-net" id="cubeNet"></div>
    </div>

    <div class="card">
      <strong>Журнал</strong>
      <div class="log" id="logBox"></div>
    </div>
  </div>

  <script>
    const APP_VERSION = "v1.1.0-claw-cal";
    const BOOST_SERVICE_UUID = "00001623-1212-efde-1623-785feabcd123";
    const BOOST_CHAR_UUID   = "00001624-1212-efde-1623-785feabcd123";

    // Порты LEGO Boost Move Hub: A = 0x00, B = 0x01, C = 0x02, D = 0x03
    const PORT_CLAW = 0x01; // Мотор клешни на порту B

    const FACE_NAMES = ["U", "R", "F", "D", "L", "B"];
    const COLOR_MAP = {
      W: { name: "Белый", hex: "#f8fafc" },
      Y: { name: "Желтый", hex: "#facc15" },
      R: { name: "Красный", hex: "#ef4444" },
      O: { name: "Оранжевый", hex: "#f97316" },
      B: { name: "Синий", hex: "#2563eb" },
      G: { name: "Зеленый", hex: "#22c55e" },
      "?": { name: "Не задан", hex: "#334155" }
    };

    let bleDevice = null;
    let bleChar = null;
    let isConnected = false;
    let stopRequested = false;

    // Состояние автокалибровки клешни
    let latestMotorAngle = 0;
    let latestAngleTs = 0;
    let clawClosedPos = null;
    let clawOpenPos = null;
    let isCalibratingClaw = false;

    // Состояние кубика
    let currentFaceIndex = 0;
    let cubeState = {};
    FACE_NAMES.forEach(f => { cubeState[f] = Array(9).fill("?"); });

    const elVersion = document.getElementById("appVersion");
    const elBtStatus = document.getElementById("btStatus");
    const elBtnConnect = document.getElementById("btnConnect");
    const elBtnStop = document.getElementById("btnStop");
    const elClawCalStatus = document.getElementById("clawCalStatus");
    const elClawBounds = document.getElementById("clawBounds");
    const elBtnRecal = document.getElementById("btnRecalibrateClaw");
    const elBtnTestClose = document.getElementById("btnTestClose");
    const elBtnTestOpen = document.getElementById("btnTestOpen");
    const elVideo = document.getElementById("video");
    const elCanvas = document.getElementById("canvas");
    const elGrid = document.getElementById("gridOverlay");
    const elScanStepText = document.getElementById("scanStepText");
    const elFacesStrip = document.getElementById("facesStrip");
    const elCubeNet = document.getElementById("cubeNet");
    const elLog = document.getElementById("logBox");

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      elLog.textContent += `[${time}] ${msg}\n`;
      elLog.scrollTop = elLog.scrollHeight;
    }

    function initUI() {
      elVersion.textContent = `Версия приложения: ${APP_VERSION}`;
      elGrid.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.className = "cell-mark";
        cell.innerHTML = `<span class="cell-dot" id="dot-${i}"></span>`;
        elGrid.appendChild(cell);
      }
      renderCubeNet();
      log(`Приложение инициализировано (${APP_VERSION}).`);
    }

    function renderCubeNet() {
      elScanStepText.textContent = `Грань ${currentFaceIndex + 1} из 6 (${FACE_NAMES[currentFaceIndex]})`;
      elFacesStrip.innerHTML = "";
      FACE_NAMES.forEach((f, idx) => {
        const filled = cubeState[f].every(c => c !== "?");
        const chip = document.createElement("span");
        chip.className = `face-chip ${filled ? "done" : ""}`;
        chip.textContent = `${f}: ${filled ? "OK" : "..."}`;
        chip.style.cursor = "pointer";
        chip.onclick = () => {
          currentFaceIndex = idx;
          renderCubeNet();
        };
        elFacesStrip.appendChild(chip);
      });

      elCubeNet.innerHTML = "";
      FACE_NAMES.forEach(f => {
        const fg = document.createElement("div");
        fg.className = "face-grid";
        fg.title = `Грань ${f}`;
        cubeState[f].forEach(code => {
          const sq = document.createElement("div");
          sq.className = "sq";
          sq.style.background = (COLOR_MAP[code] || COLOR_MAP["?"]).hex;
          fg.appendChild(sq);
        });
        elCubeNet.appendChild(fg);
      });
    }

    function setConnectedState(connected) {
      isConnected = connected;
      elBtStatus.textContent = connected ? "BT: Подключено" : "BT: Отключено";
      elBtStatus.classList.toggle("connected", connected);
      elBtnConnect.textContent = connected ? "Отключить BT" : "Подключить BT";
      elBtnRecal.disabled = !connected;
      elBtnTestClose.disabled = !connected;
      elBtnTestOpen.disabled = !connected;
    }

    async function sendCommand(bytes) {
      if (!bleChar || !isConnected) return;
      await bleChar.writeValue(new Uint8Array(bytes));
    }

    // Подписка на датчик угла/позиции мотора (Port Value / Input Format)
    async function subscribePortAngle(port) {
      // Включаем уведомления для порта мотора (режим 0x02 - Absolute Position / Angle)
      // Port Input Format Setup (0x41): [len, 0x00, 0x41, port, mode_LSB, mode_MSB, delta_LSB, delta_MSB, delta_ex, unit, notif]
      await sendCommand([0x0A, 0x00, 0x41, port, 0x02, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01]);
    }

    function handleHubNotification(event) {
      const v = event.target.value;
      if (v.byteLength < 5) return;
      const msgType = v.getUint8(2);
      // 0x45 = Port Value (Single)
      if (msgType === 0x45) {
        const port = v.getUint8(3);
        if (port === PORT_CLAW && v.byteLength >= 8) {
          latestMotorAngle = v.getInt32(4, true);
          latestAngleTs = performance.now();
        }
      }
    }

    async function setMotorPower(port, power) {
      // power от -100 до 100 -> signed int8
      const pByte = power < 0 ? (256 + power) & 0xFF : power & 0xFF;
      // Start Power (0x41 subcommand 0x01): [0x06, 0x00, 0x81, port, 0x11, 0x51, pByte]
      await sendCommand([0x06, 0x00, 0x81, port, 0x11, 0x51, pByte]);
    }

    async function stopMotor(port) {
      // Brake / Float (0x00 power)
      await sendCommand([0x06, 0x00, 0x81, port, 0x11, 0x51, 0x00]);
    }

    const sleep = (ms) => new Promise(res => setTimeout(res, ms));

    // Определение упора клешни по сопротивлению мотора:
    // подаем щадящую мощность и следим за изменением угла; при механическом упоре угол перестает меняться
    async function driveUntilStall(port, power, maxDurationMs = 3500) {
      await setMotorPower(port, power);
      const startTime = performance.now();
      let lastAngle = latestMotorAngle;
      let stallSince = null;
      const stallThresholdDeg = 2;
      const stallHoldMs = 320;

      while (!stopRequested && (performance.now() - startTime) < maxDurationMs) {
        await sleep(80);
        const curAngle = latestMotorAngle;
        if (Math.abs(curAngle - lastAngle) <= stallThresholdDeg) {
          if (stallSince === null) stallSince = performance.now();
          if ((performance.now() - stallSince) >= stallHoldMs) {
            await stopMotor(port);
            return curAngle;
          }
        } else {
          lastAngle = curAngle;
          stallSince = null;
        }
      }
      await stopMotor(port);
      return latestMotorAngle;
    }

    // Автокалибровка клешни при подключении по BT
    async function autoCalibrateClaw() {
      if (!isConnected || isCalibratingClaw) return;
      isCalibratingClaw = true;
      stopRequested = false;
      elClawCalStatus.textContent = "Калибровка...";
      log("Автокалибровка клешни: поиск крайних положений по сопротивлению мотора...");

      try {
        // Сначала немного приоткроем/подвинем или сразу найдем упор закрытия (-35) и упор открытия (+35)
        const closedAngle = await driveUntilStall(PORT_CLAW, -35, 3000);
        if (stopRequested) throw new Error("Остановлено пользователем");
        await sleep(200);

        const openAngle = await driveUntilStall(PORT_CLAW, 35, 3000);
        if (stopRequested) throw new Error("Остановлено пользователем");

        clawClosedPos = closedAngle;
        clawOpenPos = openAngle;
        elClawCalStatus.textContent = "Калибровка завершена";
        elClawBounds.textContent = `Закрыто (упор): ${clawClosedPos}° | Открыто (упор): ${clawOpenPos}° | Порт мотора клешни: B`;
        log(`Калибровка клешни завершена: закрыто = ${clawClosedPos}°, открыто = ${clawOpenPos}°.`);
      } catch (err) {
        elClawCalStatus.textContent = "Ошибка / Стоп";
        log(`Калибровка клешни прервана: ${err.message}`);
      } finally {
        await stopMotor(PORT_CLAW);
        isCalibratingClaw = false;
      }
    }

    async function connectBluetooth() {
      if (isConnected && bleDevice) {
        if (bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
        setConnectedState(false);
        log("Bluetooth отключен.");
        return;
      }

      try {
        log("Поиск LEGO Boost Move Hub...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ services: [BOOST_SERVICE_UUID] }],
          optionalServices: [BOOST_SERVICE_UUID]
        });

        bleDevice.addEventListener("gattserverdisconnected", () => {
          setConnectedState(false);
          log("Соединение с LEGO Boost разорвано.");
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(BOOST_SERVICE_UUID);
        bleChar = await service.getCharacteristic(BOOST_CHAR_UUID);
        await bleChar.startNotifications();
        bleChar.addEventListener("characteristicvaluechanged", handleHubNotification);

        setConnectedState(true);
        log("Подключено к LEGO Boost Move Hub.");

        await subscribePortAngle(PORT_CLAW);
        await sleep(250);
        await autoCalibrateClaw();
      } catch (err) {
        setConnectedState(false);
        log(`Ошибка BT: ${err.message}`);
      }
    }

    async function emergencyStop() {
      stopRequested = true;
      isCalibratingClaw = false;
      log("АВАРИЙНЫЙ СТОП!");
      if (isConnected) {
        for (const p of [0x00, 0x01, 0x02, 0x03]) {
          try { await stopMotor(p); } catch (_) {}
        }
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 640 } },
          audio: false
        });
        elVideo.srcObject = stream;
        log("Камера запущена.");
      } catch (err) {
        log(`Ошибка камеры: ${err.message}`);
      }
    }

    function classifyRGB(r, g, b) {
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      if (max - min < 35 && max > 165) return "W";
      if (r > 170 && g > 150 && b < 90) return "Y";
      if (r > 170 && g >= 70 && g < 150 && b < 80) return "O";
      if (r > 150 && g < 85 && b < 85) return "R";
      if (g > 120 && r < 120 && b < 130) return "G";
      if (b > 130 && r < 110) return "B";
      return "W";
    }

    function scanCurrentFace() {
      const ctx = elCanvas.getContext("2d");
      ctx.drawImage(elVideo, 0, 0, elCanvas.width, elCanvas.height);
      const faceKey = FACE_NAMES[currentFaceIndex];
      const detected = [];

      // Сетка внутри [12% .. 88%]
      const pad = 0.12;
      const span = 1 - pad * 2;
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const idx = row * 3 + col;
          const cx = Math.floor(((pad + (col + 0.5) * (span / 3)) * elCanvas.width));
          const cy = Math.floor(((pad + (row + 0.5) * (span / 3)) * elCanvas.height));
          const px = ctx.getImageData(cx - 4, cy - 4, 8, 8).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < px.length; i += 4) {
            r += px[i]; g += px[i + 1]; b += px[i + 2]; count++;
          }
          const code = classifyRGB(r / count, g / count, b / count);
          detected.push(code);
          const dot = document.getElementById(`dot-${idx}`);
          if (dot) dot.style.background = COLOR_MAP[code].hex;
        }
      }

      cubeState[faceKey] = detected;
      log(`Грань ${faceKey} отсканирована: ${detected.join(" ")}`);
      if (currentFaceIndex < FACE_NAMES.length - 1) {
        currentFaceIndex++;
      }
      renderCubeNet();
    }

    elBtnConnect.addEventListener("click", connectBluetooth);
    elBtnStop.addEventListener("click", emergencyStop);
    elBtnRecal.addEventListener("click", autoCalibrateClaw);
    elBtnTestClose.addEventListener("click", async () => {
      stopRequested = false;
      const pos = await driveUntilStall(PORT_CLAW, -35, 3000);
      log(`Клешня закрыта до упора (${pos}°).`);
    });
    elBtnTestOpen.addEventListener("click", async () => {
      stopRequested = false;
      const pos = await driveUntilStall(PORT_CLAW, 35, 3000);
      log(`Клешня открыта до упора (${pos}°).`);
    });
    document.getElementById("btnStartCamera").addEventListener("click", startCamera);
    document.getElementById("btnScanFace").addEventListener("click", scanCurrentFace);
    document.getElementById("btnResetCube").addEventListener("click", () => {
      FACE_NAMES.forEach(f => { cubeState[f] = Array(9).fill("?"); });
      currentFaceIndex = 0;
      renderCubeNet();
      log("Развертка кубика сброшена.");
    });

    initUI();
  </script>
</body>
</html>
