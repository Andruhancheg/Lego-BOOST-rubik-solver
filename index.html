<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LEGO Boost Rubik's Cube Solver v0.08</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    /* Восьмиугольная кнопка STOP */
    .stop-octagon {
      clip-path: polygon(29% 0%, 71% 0%, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0% 71%, 0% 29%);
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .stop-octagon:active {
      transform: scale(0.92);
      filter: brightness(1.25);
    }

    /* Анимация мигания синего для BT */
    @keyframes bt-blink {
      0%, 100% {
        background-color: #2563eb;
        box-shadow: 0 0 18px rgba(37, 99, 235, 0.85);
      }
      50% {
        background-color: #1e3a8a;
        box-shadow: 0 0 4px rgba(30, 58, 138, 0.3);
      }
    }
    .bt-connecting {
      animation: bt-blink 0.85s infinite ease-in-out;
    }

    /* Сетка прицела 3x3 поверх видео */
    .scan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
    }
