<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LEGO Boost Rubik's Cube Solver v0.07</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    /* Восьмиугольная кнопка STOP */
    .stop-octagon {
      clip-path: polygon(29% 0%, 71% 0%, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0% 71%, 0% 29%);
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .stop-octagon:active {
      transform: scale(0.92);
      filter: brightness(1.25);
    }

    /* Анимация мигания синего для BT */
    @keyframes bt-blink {
      0%, 100% {
        background-color: #2563eb;
        box-shadow: 0 0 18px rgba(37, 99, 235, 0.85);
      }
      50% {
        background-color: #1e3a8a;
        box-shadow: 0 0 4px rgba(30, 58, 138, 0.3);
      }
    }
    .bt-connecting {
      animation: bt-blink 0.85s infinite ease-in-out;
    }

    /* Сетка прицела 3x3 поверх видео */
    .scan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      padding: 8px;
    }
    .scan-cell {
      border: 2px solid rgba(255, 255, 255, 0.78);
      border-radius: 8px;
      position: relative;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.45);
    }
    .scan-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    /* Развертка 6 граней (крест 4x3) */
    .cube-net {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      max-width: 340px;
      margin: 0 auto;
    }
    .face-box {
      aspect-ratio: 1 / 1;
      background: #111827;
      border: 1.5px solid #334155;
      border-radius: 6px;
      padding: 3px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .face-box.active-face {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
    }
    .sticker {
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.4);
    }

    /* Предотвращение перехвата кликов иконками внутри кнопок */
    .no-ptr {
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-8">

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 pt-1.5 pb-2.5">
    <!-- Строка версии выше кнопки STOP -->
    <div class="flex items-center justify-between text-[11px] font-mono text-slate-400 mb-1.5 px-1">
      <span id="appVersion" class="text-sky-400 font-bold">v0.07</span>
      <span id="jsStatus" class="text-emerald-400">SYSTEM: READY</span>
    </div>

    <div class="flex items-center justify-between gap-2">
      <!-- Слева: Восьмиугольник STOP -->
      <button id="btnStop" type="button" aria-label="Экстренная остановка"
        class="stop-octagon w-16 h-16 bg-red-600 hover:bg-red-500 flex flex-col items-center justify-center shadow-lg shadow-red-950/70 shrink-0 cursor-pointer">
        <span class="no-ptr text-white font-black text-sm tracking-wider">STOP</span>
        <span class="no-ptr text-[9px] text-red-100 uppercase">Авария</span>
      </button>

      <!-- Центр: Индикатор статуса -->
      <div class="flex-1 text-center px-1 min-w-0">
        <div class="text-xs font-bold uppercase tracking-wider text-slate-300 truncate">LEGO Boost Solver</div>
        <div id="hubStatusText" class="text-xs text-amber-400 font-medium truncate mt-0.5">Нет соединения с хабом</div>
        <div class="mt-1 flex justify-center gap-1.5">
          <button id="btnDemoToggle" type="button"
            class="text-[10px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
            Демо: ВЫКЛ
          </button>
        </div>
      </div>

      <!-- Справа: Шестеренка настроек + Квадратная кнопка BT -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Кнопка настроек (левее BT) -->
        <button id="btnOpenSettings" type="button" aria-label="Настройки моторов"
          class="w-14 h-14 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 flex flex-col items-center justify-center shadow-md cursor-pointer">
          <svg class="no-ptr w-6 h-6 text-slate-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="no-ptr text-[9px] text-slate-400 mt-0.5">Порты</span>
        </button>

        <!-- Квадратная кнопка BT -->
        <button id="btnBluetooth" type="button" aria-label="Bluetooth подключение"
          class="w-14 h-14 rounded-xl bg-orange-500 hover:bg-orange-400 active:scale-95 flex flex-col items-center justify-center shadow-lg transition-colors cursor-pointer">
          <svg class="no-ptr w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7l10 10-5 5V2l5 5L7 17" />
          </svg>
          <span id="btLabel" class="no-ptr text-[10px] font-bold text-white tracking-wider">BT</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="flex-1 max-w-lg w-full mx-auto px-3 pt-3 space-y-4">

    <!-- БЛОК 1: АВТОСБОРКА -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-lg">
      <button id="btnAutoSolve" type="button"
        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.99] text-white font-extrabold text-base tracking-wide shadow-lg shadow-emerald-950/60 flex items-center justify-center gap-2 cursor-pointer">
        <span class="no-ptr text-lg">▶</span>
        <span class="no-ptr">АВТОСБОРКА КУБИКА</span>
      </button>

      <!-- Статус конвейера автосборки -->
      <div class="mt-2.5 bg-slate-950 rounded-xl p-2.5 border border-slate-800/80">
        <div class="flex justify-between text-xs mb-1">
          <span id="autoStageText" class="text-slate-300 font-medium">Ожидание запуска</span>
          <span id="autoPercentText" class="font-mono text-sky-400">0%</span>
        </div>
        <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
          <div id="autoProgressBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        </div>
        <div id="solveMovesDisplay" class="mt-2 text-[11px] font-mono text-slate-400 break-words hidden"></div>
      </div>
    </section>

    <!-- БЛОК 2: КАМЕРА И СКАНЕР ГРАНИ -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-200">1. Камера сканирования</h2>
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-1 text-[11px] text-slate-400 cursor-pointer">
            <input id="chkAutoFlash" type="checkbox" checked class="accent-sky-500 rounded" />
            Авто-вспышка
          </label>
          <button id="btnFlash" type="button"
            class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-amber-300 border border-slate-700">
            Вспышка: ВЫКЛ
          </button>
        </div>
      </div>

      <!-- Окно видеопотока -->
      <div class="relative w-full aspect-square max-w-[300px] mx-auto bg-black rounded-xl overflow-hidden border-2 border-slate-700">
        <video id="cameraVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <canvas id="captureCanvas" class="hidden"></canvas>

        <!-- Сетка 3x3 поверх видео -->
        <div id="scanOverlayGrid" class="scan-grid absolute inset-0 pointer-events-none">
          <div class="scan-cell"><span class="scan-dot" id="liveDot0"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot1"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot2"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot3"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot4"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot5"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot6"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot7"></span></div>
          <div class="scan-cell"><span class="scan-dot" id="liveDot8"></span></div>
        </div>

        <!-- Заглушка, когда камера выключена -->
        <div
